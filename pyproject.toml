[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "livhub-harness"
version = "0.1.0"
description = "Liv HUB dummy-connector harness. Offline default. Absolute Liv HUB claim."
readme = "CONTEXT.md"
requires-python = ">=3.10"
authors = [{ name = "Olivia Mae Blackwell" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov",
  "pytest-timeout",
  "ruff",
  "jsonschema",
  "filelock",
  "tenacity",
  "Pillow",
  "httpx>=0.27",
  "pydantic>=2.0",
]

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
