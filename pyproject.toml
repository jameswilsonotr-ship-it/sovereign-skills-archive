[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "livhub-harness"
version = "0.1.0"
description = "Liv HUB dummy-connector harness (MIS-6). Offline default. Absolute Liv HUB claim."
readme = "HARNESS.md"
requires-python = ">=3.10"
authors = [{ name = "Olivia Mae Blackwell" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.0",
  "pathspec>=0.12",
  "mcp>=1.0",
  "duckdb>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.package-data]
harness = ["fixtures/*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
