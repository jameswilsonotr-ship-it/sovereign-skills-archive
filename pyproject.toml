[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-coder"
version = "0.1.0"
description = "A small local coding assistant client for Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["coder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
