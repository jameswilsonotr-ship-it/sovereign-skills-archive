[project]
name = "sovereign-skills-harness"
version = "0.1.0"
description = "Offline call-shape and safety harness for the sovereign skills archive."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.3.0",
    "httpx>=0.28.1",
    "mcp>=1.9.4",
    "pathspec>=0.12.1",
    "pydantic>=2.11.5",
]

[project.optional-dependencies]
test = [
    "hypothesis>=6.168.0",
    "mypy>=2.3.1",
    "pytest>=8.3.5",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "property: Hypothesis-backed offline invariants",
    "smoke: deterministic offline contract and hygiene checks",
    "stress: bounded offline concurrency and load checks",
]

[tool.setuptools.package-data]
sovereign_harness = ["fixtures/*.json", "py.typed"]
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
files = ["src"]
mypy_path = ["stubs"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
