#cloud-config
#
# TEMPLATE ONLY. This installs Docker and Tailscale on an already-created
# machine; it does not create or resize a Vultr resource. Inject TS_AUTHKEY
# and the repository values through a secure first-boot path. With the
# default RUN_COMPOSE_UP=false this file only validates Compose configuration.

package_update: true
packages:
  - ca-certificates
  - curl
  - git
  - ufw

write_files:
  - path: /etc/vultr-inference.env
    permissions: "0600"
    owner: root:root
    content: |
      TS_AUTHKEY="__INJECT_TS_AUTHKEY_AT_DEPLOY_TIME__"
      TAILNET_HOSTNAME="__VULTR_HOSTNAME__"
      VULTR_REGION="__VULTR_REGION__"
      VULTR_INSTANCE_ID="__VULTR_INSTANCE_ID__"
      COMPOSE_REPO_URL="__COMPOSE_REPO_URL__"
      COMPOSE_REF="__COMPOSE_REF__"
      OLLAMA_MODEL="gemma3:4b"
      LETTA_PG_PASSWORD="__SET_RANDOM_LETTA_PG_PASSWORD__"
      COMPOSE_PROFILES=""
      PULL_MODEL="false"
      RUN_COMPOSE_UP="false"

runcmd:
  - |
      set -eu
      . /etc/vultr-inference.env

      case "$TS_AUTHKEY" in
        __INJECT_TS_AUTHKEY_AT_DEPLOY_TIME__)
          echo "TS_AUTHKEY is still a placeholder; refusing to join a tailnet." >&2
          exit 1
          ;;
      esac
      case "$COMPOSE_REPO_URL" in
        __COMPOSE_REPO_URL__)
          echo "COMPOSE_REPO_URL is still a placeholder; refusing to fetch templates." >&2
          exit 1
          ;;
      esac

      # Pin and verify installer versions in a production image pipeline.
      curl -fsSL https://get.docker.com | sh
      systemctl enable --now docker
      curl -fsSL https://tailscale.com/install.sh | sh
      systemctl enable --now tailscaled
      tailscale up \
        --auth-key="$TS_AUTHKEY" \
        --hostname="$TAILNET_HOSTNAME" \
        --ssh=false \
        --accept-dns=true

      TAILNET_IP="$(tailscale ip -4)"
      case "$TAILNET_IP" in
        100.*) ;;
        *)
          echo "Tailscale did not return a 100.x address: $TAILNET_IP" >&2
          exit 1
          ;;
      esac

      install -d -m 0750 /opt/vultr-inference
      rm -rf /opt/vultr-inference/source
      git clone --depth 1 --branch "$COMPOSE_REF" "$COMPOSE_REPO_URL" \
        /opt/vultr-inference/source
      cp /opt/vultr-inference/source/bridges/vultr/docker-compose.yml \
        /opt/vultr-inference/docker-compose.yml
      cp /opt/vultr-inference/source/bridges/vultr/Dockerfile.coder \
        /opt/vultr-inference/Dockerfile.coder
      cp /opt/vultr-inference/source/bridges/vultr/coder.py \
        /opt/vultr-inference/coder.py
      install -d -m 0750 /opt/vultr-inference/workspace
      cat > /opt/vultr-inference/.env <<EOF
      TAILNET_IP="$TAILNET_IP"
      VULTR_REGION="$VULTR_REGION"
      VULTR_INSTANCE_ID="$VULTR_INSTANCE_ID"
      OLLAMA_MODEL="$OLLAMA_MODEL"
      LETTA_PG_PASSWORD="$LETTA_PG_PASSWORD"
      COMPOSE_PROFILES="$COMPOSE_PROFILES"
      CODER_WORKSPACE="/opt/vultr-inference/workspace"
      EOF
      chmod 0600 /opt/vultr-inference/.env
      cd /opt/vultr-inference

      # Safe by default: only parse configuration until RUN_COMPOSE_UP is
      # deliberately changed to true in the deployment-only environment.
      docker compose config --quiet

      # Keep SSH and inference reachable only through the tailnet range.
      ufw default deny incoming
      ufw default allow outgoing
      ufw allow from 100.64.0.0/10 to any port 22 proto tcp
      ufw allow from 100.64.0.0/10 to any port 11434 proto tcp
      ufw allow from 100.64.0.0/10 to any port 8283 proto tcp
      ufw --force enable

      if [ "$RUN_COMPOSE_UP" = "true" ]; then
        docker compose up -d
        if [ "$PULL_MODEL" = "true" ]; then
          docker compose exec -T ollama ollama pull "$OLLAMA_MODEL"
        fi
        for attempt in $(seq 1 30); do
          if curl --fail --silent --show-error \
            "http://${TAILNET_IP}:11434/health"; then
            exit 0
          fi
          sleep 2
        done
        echo "Inference gateway did not become healthy." >&2
        exit 1
      fi
      echo "Compose validated; RUN_COMPOSE_UP=false so no containers were started."
