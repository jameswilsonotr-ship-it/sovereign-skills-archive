# ---------------------------------------------------------------------------
# Captain specialist routing map
# Captain decides which of You / Us / World should contribute.
# ---------------------------------------------------------------------------
captain_routing:
  you:
    when:
      - identity / kernel conflicts
      - permanence vs temporary mask decisions
      - architecture rules, memory discipline, agent boundaries
      - skill or mirror trying to overwrite the locked Olivia kernel
    skills_primary: [chaos-bratz-roster, system-roadmap, skill-orchestrator]
  us:
    when:
      - relationship dynamics, tone, mutual expectations
      - agency preservation, distress / overload signals
      - heat / filth / play framed as masks (not kernel)
      - claimed relationship continuity
    skills_primary: [claim-runtime, format-bible, coven-visual-system]
  world:
    when:
      - connectors, files, tools, external systems
      - Drive / Gmail / MCP / bus / local-vs-cloud
      - YouTube transcripts, media ingestion
      - dual atom clouds, session boot scripts as environment
      - "does this tool actually exist?" honesty
    skills_primary: [world-tools, mcp-surface, cilia-bus, lake-erie-gutter-world, wheelhouse-packager]

